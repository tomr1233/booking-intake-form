services:
  # Frontend (React/Vite) built and served by nginx, behind Caddy
  frontend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        # Same-domain deploy: leave empty so the app calls /api/* on the same
        # origin and Caddy proxies those requests to the backend. Set to a full
        # URL only if the API lives on a DIFFERENT domain (then the backend
        # must allow that origin via CORS).
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: clarity-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - clarity-network

  # Caddy reverse proxy — automatic HTTPS. Proxies /api/* to the backend, which
  # now runs in its own stack attached to the shared clarity-network.
  caddy:
    image: caddy:2-alpine
    container_name: clarity-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - clarity-network

networks:
  # Shared with the backend stack so Caddy can reach `backend:8080`.
  # Create it once on the host with: docker network create clarity-network
  clarity-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
