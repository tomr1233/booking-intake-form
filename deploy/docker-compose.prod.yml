services:
  # Frontend (React/Vite) built and served by nginx.
  # TLS + routing is handled by the pre-existing reverse proxy on the host,
  # which forwards intake.expressnext.app -> this container's published port.
  frontend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        # Leave empty for same-domain: the app calls /api/* on the same origin,
        # and the host proxy must route /api/* to the backend. Set to a full URL
        # only if the API is served from a DIFFERENT domain (then the backend
        # must allow that origin via CORS).
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: clarity-frontend
    restart: unless-stopped
    ports:
      # Bound to loopback only — the host Caddy reaches it at 127.0.0.1:3000
      # and the raw frontend isn't exposed publicly.
      - "127.0.0.1:3000:80"
