# deploy/nginx.conf for the cluster: port 8080 (non-root) and relative redirects, because
# nginx doesn't know the public host and port behind Traefik.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kubernetes probes only: on the public host, /health goes to the API (Ingress).
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
